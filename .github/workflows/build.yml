name: Matrix Client — GitHub Auto Update

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-client-auto-release
  cancel-in-progress: true

env:
  PACKAGE_NAME: Matrix-Client-MathPRIME-v1.3.4-ADVANCED-MODS-TEXTURES-BADGES.zip
  RELEASE_TAG: matrix-auto
  RELEASE_NAME: Matrix Client — GitHub Auto Update

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stamp GitHub build
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $info = @{
            version = $pkg.version
            buildId = "${{ github.sha }}"
            channel = "github-auto"
            source = "github-push"
            repository = "francamatheus165-prog/matrix-client"
            commit = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json
          Set-Content -Path "src/update-info.json" -Value $info -Encoding UTF8

      - name: Build Windows app
        run: npx electron-builder --win --x64 --publish never

      - name: Create single official update ZIP
        shell: pwsh
        run: |
          $zip = $env:PACKAGE_NAME
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "dist/win-unpacked/*" -DestinationPath $zip -CompressionLevel Optimal

      - name: Create update manifest
        shell: pwsh
        run: |
          $sha = (Get-FileHash $env:PACKAGE_NAME -Algorithm SHA256).Hash.ToLower()
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $manifest = @{
            latestVersion = $pkg.version
            buildId = "${{ github.sha }}"
            channel = "github-auto"
            source = "github-push"
            repository = "francamatheus165-prog/matrix-client"
            mandatory = $false
            changelog = "Automatic GitHub build from commit ${{ github.sha }}."
            notes = @(
              "Every push to main/master creates a new automatic build.",
              "The official update package is the single Matrix Client ZIP.",
              "SHA-256: $sha"
            )
            sha256 = $sha
            packageName = $env:PACKAGE_NAME
          } | ConvertTo-Json -Depth 5
          Set-Content -Path "matrix-manifest.json" -Value $manifest -Encoding UTF8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: matrix-client-windows-${{ github.run_number }}
          path: |
            ${{ env.PACKAGE_NAME }}
            matrix-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Create or update rolling GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Rolling automatic build. Updated on every push to main/master." `
              --prerelease `
              --target "${{ github.sha }}"
          } else {
            gh release edit $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Rolling automatic build. Current commit: ${{ github.sha }}" `
              --prerelease `
              --target "${{ github.sha }}"
          }

      - name: Publish official update package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release upload $env:RELEASE_TAG `
            $env:PACKAGE_NAME `
            matrix-manifest.json `
            --clobber
