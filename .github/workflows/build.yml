name: Matrix Client — GitHub Auto Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-client-auto-build
  cancel-in-progress: true

env:
  RELEASE_TAG: matrix-auto
  RELEASE_NAME: Matrix Client — GitHub Auto Update
  INSTALLER_NAME: Matrix-Client-MathPRIME-Setup.exe
  UPDATE_BRANCH: updates

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      # npm install is intentional here because package.json and
      # package-lock.json are currently out of sync.
      - name: Install dependencies
        run: npm install

      - name: Create build information
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $info = @{
            version = $pkg.version
            buildId = "${{ github.sha }}"
            channel = "github-auto"
            repository = "francamatheus165-prog/matrix-client"
            commit = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "src/update-info.json" -Value $info -Encoding UTF8

      - name: Verify Matrix Client icon
        shell: pwsh
        run: |
          if (!(Test-Path "src/assets/icon.png")) {
            Write-Error "src/assets/icon.png was not found."
            exit 1
          }
          Write-Host "Matrix Client icon found."

      - name: Clean dist
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

      - name: Build Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Find installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" -File |
            Where-Object {
              $_.Name -notmatch "unins" -and
              $_.Name -notmatch "setup-blockmap"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $installer) {
            Write-Error "No Windows installer was produced."
            Get-ChildItem "dist" -Recurse | Select-Object FullName
            exit 1
          }

          Copy-Item $installer.FullName $env:INSTALLER_NAME -Force
          Write-Host "Installer: $env:INSTALLER_NAME"

      - name: Calculate installer SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash $env:INSTALLER_NAME -Algorithm SHA256).Hash.ToLower()
          "INSTALLER_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "SHA-256: $hash"

      - name: Create or update automatic release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client Windows build from commit ${{ github.sha }}." `
              --prerelease `
              --target "${{ github.sha }}"
          }
          else {
            gh release edit $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client Windows build from commit ${{ github.sha }}." `
              --prerelease `
              --target "${{ github.sha }}"
          }

      - name: Remove old release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'
          foreach ($asset in $assets) {
            gh release delete-asset $env:RELEASE_TAG $asset --yes
          }

      - name: Publish ONLY the EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload `
            $env:RELEASE_TAG `
            $env:INSTALLER_NAME `
            --clobber

      - name: Publish update metadata to updates branch
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          $metadata = @{
            version = ((Get-Content package.json -Raw | ConvertFrom-Json).version)
            buildId = "${{ github.sha }}"
            commit = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            repository = "francamatheus165-prog/matrix-client"
            channel = "github-auto"
            installerName = $env:INSTALLER_NAME
            installerUrl = "https://github.com/francamatheus165-prog/matrix-client/releases/download/matrix-auto/$env:INSTALLER_NAME"
            sha256 = $env:INSTALLER_SHA256
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "latest.json" -Value $metadata -Encoding UTF8

          git fetch origin "$env:UPDATE_BRANCH" 2>$null

          if ($LASTEXITCODE -eq 0) {
            git switch --force-create "$env:UPDATE_BRANCH" "origin/$env:UPDATE_BRANCH"
            git rm -rf . 2>$null
          }
          else {
            git switch --orphan "$env:UPDATE_BRANCH"
            git rm -rf . 2>$null
          }

          Set-Content -Path "latest.json" -Value $metadata -Encoding UTF8
          git add latest.json
          git commit -m "Update Matrix Client build metadata [skip ci]" 2>$null
          git push origin "HEAD:$env:UPDATE_BRANCH" --force

          Write-Host "Update metadata published to branch: $env:UPDATE_BRANCH"
