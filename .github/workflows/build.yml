name: Matrix Client Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Matrix Client Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build Windows
        run: npx electron-builder --win nsis portable --x64

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: matrix-client-windows
          path: |
            dist/*.exe
            dist/*.blockmap
          if-no-files-found: error
