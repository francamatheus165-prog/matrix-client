name: Matrix Client — Automatic Windows Build

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - "src/update-info.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-client-build
  cancel-in-progress: true

env:
  RELEASE_TAG: matrix-auto
  RELEASE_NAME: Matrix Client — Automatic Build
  INSTALLER_NAME: Matrix-Client-MathPRIME-Setup.exe
  UPDATE_INFO_PATH: src/update-info.json
  UPDATE_DOWNLOAD_URL: https://github.com/francamatheus165-prog/matrix-client/releases/download/matrix-auto/Matrix-Client-MathPRIME-Setup.exe

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Create local build information
        shell: pwsh
        run: |
          $buildInfo = @{
            repository = "francamatheus165-prog/matrix-client"
            branch = "${{ github.ref_name }}"
            commit = "${{ github.sha }}"
            buildId = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            channel = "github-auto"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $env:UPDATE_INFO_PATH -Value $buildInfo -Encoding UTF8

      - name: Verify Matrix Client icon
        shell: pwsh
        run: |
          if (!(Test-Path "src/assets/icon.png")) {
            Write-Error "src/assets/icon.png not found."
            exit 1
          }

      - name: Clean dist
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Find installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" -File |
            Where-Object {
              $_.Name -notmatch "unins" -and
              $_.Name -notmatch "setup-blockmap"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $installer) {
            Write-Error "No Windows installer .exe was found in dist."
            Get-ChildItem "dist" -Recurse | Select-Object FullName
            exit 1
          }

          Copy-Item $installer.FullName $env:INSTALLER_NAME -Force
          Write-Host "Installer: $env:INSTALLER_NAME"

      - name: Verify final EXE
        shell: pwsh
        run: |
          if (!(Test-Path $env:INSTALLER_NAME)) {
            Write-Error "Final installer does not exist."
            exit 1
          }

          $file = Get-Item $env:INSTALLER_NAME
          Write-Host "$($file.Name) - $($file.Length) bytes"

      - name: Create or update automatic release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client Windows build. Commit: ${{ github.sha }}" `
              --prerelease `
              --target "${{ github.sha }}"
          }
          else {
            gh release edit $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client Windows build. Commit: ${{ github.sha }}" `
              --prerelease `
              --target "${{ github.sha }}"
          }

      - name: Remove old release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'

          foreach ($asset in $assets) {
            if ($asset -ne $env:INSTALLER_NAME) {
              Write-Host "Removing old release asset: $asset"
              gh release delete-asset $env:RELEASE_TAG $asset --yes
            }
          }

      - name: Publish only the EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG $env:INSTALLER_NAME --clobber

      - name: Create latest update information
        shell: pwsh
        run: |
          $sha256 = (Get-FileHash $env:INSTALLER_NAME -Algorithm SHA256).Hash.ToLower()

          $buildInfo = @{ 
            repository = "francamatheus165-prog/matrix-client"
            branch = "${{ github.ref_name }}"
            commit = "${{ github.sha }}"
            buildId = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            channel = "github-auto"
            packageName = $env:INSTALLER_NAME
            downloadUrl = $env:UPDATE_DOWNLOAD_URL
            sha256 = $sha256
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5

          Set-Content -Path $env:UPDATE_INFO_PATH -Value $buildInfo -Encoding UTF8

      - name: Publish update information to GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add $env:UPDATE_INFO_PATH

          $changed = git diff --cached --name-only
          if ($changed) {
            git commit -m "chore: update Matrix Client build info [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          }
          else {
            Write-Host "No update-info changes to commit."
          }
