name: Matrix Client — Automatic Windows Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-client-build
  cancel-in-progress: true

env:
  RELEASE_TAG: matrix-auto
  RELEASE_NAME: Matrix Client — Automatic Build
  INSTALLER_NAME: Matrix-Client-MathPRIME-Setup.exe

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Create build information
        shell: pwsh
        run: |
          $buildInfo = @{
            repository = "francamatheus165-prog/matrix-client"
            branch = "${{ github.ref_name }}"
            commit = "${{ github.sha }}"
            buildId = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            channel = "github-auto"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5

          Set-Content -Path "src/update-info.json" -Value $buildInfo -Encoding UTF8

      - name: Verify Matrix Client icon
        shell: pwsh
        run: |
          if (!(Test-Path "src/assets/icon.png")) {
            Write-Error "src/assets/icon.png não encontrado."
            exit 1
          }

      - name: Clean dist
        shell: pwsh
        run: |
          if (Test-Path "dist") {
            Remove-Item "dist" -Recurse -Force
          }

      - name: Build Windows installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Find installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "dist" -Filter "*.exe" -File |
            Where-Object {
              $_.Name -notmatch "unins" -and
              $_.Name -notmatch "setup-blockmap"
            } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1

          if ($null -eq $installer) {
            Write-Error "Nenhum instalador .exe foi encontrado em dist."
            Get-ChildItem "dist" -Recurse | Select-Object FullName
            exit 1
          }

          Copy-Item $installer.FullName $env:INSTALLER_NAME -Force
          Write-Host "Installer: $env:INSTALLER_NAME"

      - name: Verify final EXE
        shell: pwsh
        run: |
          if (!(Test-Path $env:INSTALLER_NAME)) {
            Write-Error "O instalador final não existe."
            exit 1
          }

          $file = Get-Item $env:INSTALLER_NAME
          Write-Host "$($file.Name) - $($file.Length) bytes"

      - name: Create or update automatic release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client Windows build. Commit: ${{ github.sha }}" `
              --prerelease `
              --target "${{ github.sha }}"
          }
          else {
            gh release edit $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client Windows build. Commit: ${{ github.sha }}" `
              --prerelease `
              --target "${{ github.sha }}"
          }

      - name: Remove old release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = gh release view $env:RELEASE_TAG --json assets --jq '.assets[].name'

          foreach ($asset in $assets) {
            if ($asset -ne $env:INSTALLER_NAME) {
              Write-Host "Removing old release asset: $asset"
              gh release delete-asset $env:RELEASE_TAG $asset --yes
            }
          }

      - name: Publish only the EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload $env:RELEASE_TAG $env:INSTALLER_NAME --clobber
