name: Matrix Client — GitHub Auto Build

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: matrix-client-auto-build
  cancel-in-progress: true

env:
  PACKAGE_NAME: Matrix-Client-MathPRIME-v1.3.4-ADVANCED-MODS-TEXTURES-BADGES.zip
  RELEASE_TAG: matrix-auto
  RELEASE_NAME: Matrix Client — GitHub Auto Update

jobs:
  build-windows:
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Create GitHub build information
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json

          $info = @{
            version = $pkg.version
            buildId = "${{ github.sha }}"
            channel = "github-auto"
            repository = "francamatheus165-prog/matrix-client"
            commit = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            builtAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json

          Set-Content `
            -Path "src/update-info.json" `
            -Value $info `
            -Encoding UTF8

      - name: Build Matrix Client
        run: npm run build

      - name: Create official ZIP
        shell: pwsh
        run: |
          $zip = $env:PACKAGE_NAME

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          if (!(Test-Path "dist/win-unpacked")) {
            Write-Error "dist/win-unpacked não foi encontrado."
            exit 1
          }

          Compress-Archive `
            -Path "dist/win-unpacked/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

      - name: Create update manifest
        shell: pwsh
        run: |
          $hash = (
            Get-FileHash `
              $env:PACKAGE_NAME `
              -Algorithm SHA256
          ).Hash.ToLower()

          $pkg = Get-Content package.json -Raw | ConvertFrom-Json

          $manifest = @{
            latestVersion = $pkg.version
            buildId = "${{ github.sha }}"
            channel = "github-auto"
            repository = "francamatheus165-prog/matrix-client"
            commit = "${{ github.sha }}"
            runNumber = "${{ github.run_number }}"
            mandatory = $false
            packageName = $env:PACKAGE_NAME
            sha256 = $hash
            changelog = "Automatic build from GitHub commit ${{ github.sha }}"
            generatedAt = (Get-Date).ToUniversalTime().ToString("o")
          } | ConvertTo-Json -Depth 5

          Set-Content `
            -Path "matrix-manifest.json" `
            -Value $manifest `
            -Encoding UTF8

      - name: Upload GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Matrix-Client-Windows-${{ github.run_number }}
          path: |
            ${{ env.PACKAGE_NAME }}
            matrix-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Create or update automatic Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:RELEASE_TAG *> $null

          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client build generated from GitHub." `
              --prerelease `
              --target "${{ github.sha }}"
          }
          else {
            gh release edit $env:RELEASE_TAG `
              --title $env:RELEASE_NAME `
              --notes "Automatic Matrix Client build. Current commit: ${{ github.sha }}" `
              --prerelease `
              --target "${{ github.sha }}"
          }

      - name: Publish official ZIP and manifest
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload `
            $env:RELEASE_TAG `
            $env:PACKAGE_NAME `
            matrix-manifest.json `
            --clobber
