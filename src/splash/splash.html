<!DOCTYPE html><html><head><meta charset="UTF-8"><style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}html,body{width:100%;height:100%;overflow:hidden}body{background:#181818;border:1px solid #353535;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;overflow:hidden;-webkit-app-region:drag}.title{font-size:24px;font-weight:700;color:#e6f1ff;letter-spacing:1px}.bar-wrap{width:200px;height:3px;background:#242424;border-radius:2px;overflow:hidden}.bar-fill{height:100%;width:0;background:#517fe6;border-radius:2px;transition:width .25s ease}#splash-status{font-size:11px;color:#777}.version{position:absolute;bottom:14px;right:16px;font-size:10px;color:#555}#custom-opening{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;display:none;border-radius:12px}.default-splash{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}.skip{position:absolute;left:10px;bottom:9px;z-index:20;display:none;-webkit-app-region:no-drag;border:1px solid rgba(255,255,255,.18);background:rgba(0,0,0,.45);color:#fff;border-radius:7px;padding:6px 9px;font-size:10px;cursor:pointer}.skip:hover{background:rgba(255,255,255,.12)}
</style></head><body><video id="custom-opening" playsinline autoplay muted></video><button class="skip" id="skip-opening">Skip opening</button><div class="default-splash" id="default-splash"><div class="title">Matrix Client — MMMD Edition</div><div class="bar-wrap"><div class="bar-fill" id="splash-bar"></div></div><div id="splash-status">Starting…</div><div class="version">v1.3.4</div></div><script>
const {ipcRenderer}=require('electron');const params=new URLSearchParams(location.search);const video=document.getElementById('custom-opening');const fallback=document.getElementById('default-splash');const skip=document.getElementById('skip-opening');const remoteId=params.get('remoteId');
function notifyVideoMode(){ipcRenderer.send('splash-opening-mode','video')}
function finished(){ipcRenderer.send('splash-opening-finished')}
function showVideo(src){if(!src)return false;notifyVideoMode();video.src=src;video.style.display='block';fallback.style.display='none';skip.style.display='block';video.currentTime=0;const p=video.play();if(p&&p.catch)p.catch(()=>{});return true}
function showDefault(){video.pause();video.removeAttribute('src');video.style.display='none';fallback.style.display='flex';skip.style.display='none';finished()}
video.addEventListener('ended',finished,{once:true});video.addEventListener('error',showDefault);skip.onclick=()=>showDefault();
async function initOpening(){const direct=params.get('customVideo');if(direct){showVideo(direct);return;}if(params.get('remoteCatalog')==='1'&&remoteId){try{const cat=await ipcRenderer.invoke('get-online-openings');const item=(cat.openings||[]).find(o=>String(o.id)===String(remoteId));if(item&&item.url){showVideo(item.url);return;}}catch(e){}}showDefault()}
initOpening();ipcRenderer.on('splash-status',(_,msg)=>{const el=document.getElementById('splash-status');if(el)el.textContent=msg});ipcRenderer.on('splash-progress',(_,pct)=>{const el=document.getElementById('splash-bar');if(el)el.style.width=pct+'%'});
</script></body></html>
